[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "testguard"
version = "0.1.0"
description = "Linux-first, local-first CLI wrapper for test resource monitoring and safety enforcement."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "TestGuard Maintainers"}]
dependencies = []

[project.optional-dependencies]
psutil = ["psutil>=5.9"]
pynvml = ["pynvml>=11.5"]

[project.scripts]
testguard = "testguard.cli:entrypoint"

[tool.setuptools.packages.find]
where = ["."]
include = ["testguard*"]
