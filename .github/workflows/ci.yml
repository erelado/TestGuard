name: ci

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          allow-prereleases: true

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml

      - name: Unit tests
        run: uv run python -m unittest discover -t . -s tests -p "test_*.py" -v

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          allow-prereleases: true

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml

      - name: Create venv
        run: uv venv

      - name: Install editable
        run: uv pip install -e .

      - name: Memory governor demo
        shell: bash
        run: |
          set -euo pipefail
          out="$(uv run testguard run --max-memory-mib 8 -- python -m testguard.demo.workload --alloc-mib 128 --hold-s 5 || true)"
          echo "$out"
          run_id="$(echo "$out" | sed -n 's/^run_id: //p' | head -n1)"
          run_dir="$HOME/.testguard/runs/$run_id"
          echo "Run dir: $run_dir"
          test -f "$run_dir/run_report.json" || (echo "❌ Missing run_report.json" && exit 1)
          status=$(jq -r '.status' "$run_dir/run_report.json")
          if [[ "$status" == "KILLED" ]]; then
            echo "✅ Kill detected (memory panic)"
          else
            echo "⚠️ Run completed normally (expected on restricted CI cgroups, status=$status)"
          fi

      - name: Timeout governor demo
        shell: bash
        run: |
          set -euo pipefail
          out="$(uv run testguard run --max-runtime-s 1 -- python -m testguard.demo.workload --hold-s 3 || true)"
          echo "$out"
          run_id="$(echo "$out" | sed -n 's/^run_id: //p' | head -n1)"
          run_dir="$HOME/.testguard/runs/$run_id"
          jq '.status' "$run_dir/run_report.json"
          jq '.status' "$run_dir/run_report.json" | grep -Eq '"(KILLED|OK)"' || echo "⚠️ No timeout kill detected"
          echo "✅ Timeout test done"
