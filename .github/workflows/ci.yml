name: ci

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          allow-prereleases: true

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml

      - name: Unit tests
        run: uv run python -m unittest discover -t . -s tests -p "test_*.py" -v

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          allow-prereleases: true

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml

      - name: Create venv
        run: uv venv

      - name: Install editable
        run: uv pip install -e .

      - name: Memory governor demo
        shell: bash
        run: |
          set -euo pipefail
          out="$(uv run testguard run --max-memory-mib 8 -- python -m testguard.demo.workload --alloc-mib 128 --hold-s 5 2>&1 || true)"
          echo "$out"
          run_id="$(echo "$out" | sed -n 's/^run_id: //p' | head -n1)"
          run_dir="$HOME/.testguard/runs/$run_id"
          echo "Run dir: $run_dir"

          if [[ ! -f "$run_dir/run_report.json" ]]; then
            echo "❌ Missing run_report.json"
            exit 1
          fi

          status=$(jq -r '.status' "$run_dir/run_report.json")
          if [[ "$status" == "KILLED" ]]; then
            echo "✅ Kill detected (memory panic)"
          else
            echo "⚠️ Run completed normally (expected on restricted CI cgroups, status=$status)"
          fi

          # Show summary for log visibility
          cat "$run_dir/run_report.md" || true
          echo "run_id=$run_id" >> "$GITHUB_ENV"

      - name: Timeout governor demo
        shell: bash
        run: |
          set -euo pipefail
          out="$(uv run testguard run --max-runtime-s 1 -- python -m testguard.demo.workload --hold-s 3 2>&1 || true)"
          echo "$out"
          run_id="$(echo "$out" | sed -n 's/^run_id: //p' | head -n1)"
          run_dir="$HOME/.testguard/runs/$run_id"
          echo "Run dir: $run_dir"

          if [[ ! -f "$run_dir/run_report.json" ]]; then
            echo "❌ Missing run_report.json"
            exit 1
          fi

          status=$(jq -r '.status' "$run_dir/run_report.json")
          if [[ "$status" == "KILLED" ]]; then
            echo "✅ Timeout kill detected"
          else
            echo "⚠️ No timeout kill detected (status=$status)"
          fi

          cat "$run_dir/run_report.md" || true
          echo "last_run_id=$run_id" >> "$GITHUB_ENV"

      - name: Upload TestGuard artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testguard-artifacts-${{ env.run_id || env.last_run_id }}
          path: ~/.testguard/runs/
          retention-days: 30
